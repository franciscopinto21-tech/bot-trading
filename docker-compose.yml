# Docker Compose para el Bot de Inversión Inteligente
version: '3.8'

services:
  trading-bot:
    build: .
    container_name: trading-bot
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./models:/app/models
      - ./.env:/app/.env
    environment:
      - TZ=UTC
    restart: unless-stopped
    command: python -m src.main --mode paper --symbol BTC/USDT

  # Redis para colas de mensajes (opcional)
  redis:
    image: redis:7-alpine
    container_name: trading-bot-redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  # Dashboard web (opcional)
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: trading-bot-dashboard
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./.env:/app/.env
    command: uvicorn src.dashboard:app --host 0.0.0.0 --port 8000
    depends_on:
      - trading-bot
    restart: unless-stopped
